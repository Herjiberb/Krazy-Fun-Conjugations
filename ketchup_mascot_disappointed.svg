
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- Ketchup Body -->
                    <g id="ketchup-body">
                        <!-- Red bottle bottom -->
                        <path d="M60,95 H40 C35,95 35,90 35,90 V60 H65 V90 C65,90 65,95 60,95 Z" fill="#E53935"></path>
                        <!-- Red bottle top/shoulder -->
                        <path d="M65,60 H35 C35,55 40,50 40,50 H60 C60,50 65,55 65,60 Z" fill="#E53935"></path>
                        <!-- Silver neck/cap -->
                        <path d="M57,50 H43 V25 L50,15 L57,25 V50 Z" fill="#E0E0E0"></path>
                        <!-- Lid/Tip -->
                        <rect x="40" y="10" width="20" height="5" rx="2" fill="#B0B0B0"></rect>
                        <!-- Label/Face Area -->
                        <rect x="38" y="65" width="24" height="20" fill="#FFF9C4"></rect>
                    </g>
                    <!-- Single Active Face Expression -->
                    <g id="face-expressions"><g id="disappointed-face" class="mascot-expression">
                            <circle cx="47" cy="75" r="2" fill="#212121"></circle>
                            <circle cx="53" cy="75" r="2" fill="#212121"></circle>
                            <!-- Slight frown / Displeased mouth -->
                            <path d="M47,80 C48,78.5 52,78.5 53,80" stroke="#212121" stroke-width="1.5" fill="none"></path>
                            <!-- One raised eyebrow (above left eye) -->
                            <line x1="45" x2="49" y1="72" y2="71" stroke="#212121" stroke-width="1.5" stroke-linecap="round"></line>
                            <!-- Normal eyebrow (above right eye) -->
                            <line x1="51" x2="55" y1="72" y2="72" stroke="#212121" stroke-width="1.5" stroke-linecap="round"></line>
                        </g></g>
                </svg>
            